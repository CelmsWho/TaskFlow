<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Autorizācija</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-icon">
            <svg width="24" height="24" fill="none" stroke="white" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <!-- Login form -->
        <div id="login-view">
            <h2 class="auth-title">Esiet sveicināti atpakaļ!</h2>
            <p class="auth-subtitle">Ievadiet datus, lai piekļūtu savam kontam</p>
            <form id="login-form">
                <div class="form-group">
                    <label class="auth-label" for="login-email">E-pasta adrese</label>
                    <input type="email" id="login-email" placeholder="janis@piemera.lv" class="form-input" required />
                </div>
                <div class="form-group">
                    <label class="auth-label" for="login-password">Parole</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="form-input" required />
                </div>
                <button type="submit" class="btn-primary">Pieslēgties</button>
            </form>
            <div class="auth-footer">
                <p>Vēl nav konta? <button type="button" onclick="switchAuthView('register')">Izveidot kontu</button></p>
            </div>
        </div>

        <!-- Register form -->
        <div id="register-view" class="hidden">
            <h2 class="auth-title">Izveidot kontu</h2>
            <p class="auth-subtitle">Sāc plānot un pārvaldīt savus projektus</p>
            <form id="register-form">
                <div class="form-group">
                    <label class="auth-label" for="register-name">Pilns vārds</label>
                    <input type="text" id="register-name" placeholder="Jānis Bērziņš" class="form-input" required />
                </div>
                <div class="form-group">
                    <label class="auth-label" for="register-email">E-pasta adrese</label>
                    <input type="email" id="register-email" placeholder="janis@piemera.lv" class="form-input" required />
                </div>
                <div class="form-group">
                    <label class="auth-label" for="register-password">Parole</label>
                    <input type="password" id="register-password" minlength="6" placeholder="Vismaz 6 simboli" class="form-input" required />
                </div>
                <button type="submit" class="btn-primary">Reģistrēties</button>
            </form>
            <div class="auth-footer">
                <p>Jau ir konts? <button type="button" onclick="switchAuthView('login')">Pieteikties</button></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
